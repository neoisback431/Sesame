# SPDX-License-Identifier: Apache-2.0
# Environnement de DEV / DÉMO. Tous les secrets ci-dessous sont des valeurs
# de dev publiques : ne jamais les réutiliser ailleurs.
#
# Prérequis : make dev-certs   (certificat TLS auto-signé pour *.sesame.localhost)
# Entrées   : https://sesame.localhost:8443        (page « Mes applications »)
#             https://admin.sesame.localhost:8443  (administration)
#
# Par défaut : services Sesame (portail, proxy, admin, recorder) + PostgreSQL + Nginx.
# Le fournisseur d'identité est le vôtre : renseignez SESAME_OIDC_* dans un fichier
# .env (voir .env.example). Facultatif :
#   - Keycloak de dev (version autonome, sans IdP existant) : décommentez le service
#     `keycloak` plus bas et la ligne `keycloak:` du `depends_on` du portail ;
#   - appli factice de démo : profil `demo` (make up-demo, qui exige aussi Keycloak).

name: sesame

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8443:8443"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      default:
        # Les services joignent le portail et l'IdP par les mêmes URLs que le
        # navigateur : l'issuer OIDC est identique des deux côtés.
        aliases: [sesame.localhost, idp.sesame.localhost, fake-app.sesame.localhost]
    # Pas de dépendance à keycloak : Nginx résout ses cibles à la volée et démarre
    # sans lui (idp.sesame.localhost répond alors 502).
    depends_on: [portal, proxy, admin]
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: deploy/docker/rust.Dockerfile
      args: { BIN: sesame-portal }
      target: runtime-portal
    environment:
      SESAME_PORTAL_LISTEN: 0.0.0.0:8080
      SESAME_PUBLIC_URL: https://sesame.localhost:8443
      SESAME_COOKIE_DOMAIN: sesame.localhost
      SESAME_DESCRIPTORS_DIR: /etc/sesame/descriptors
      # Fournisseur d'identité : valeurs du .env, à défaut celles du Keycloak de dev.
      SESAME_OIDC_ISSUER: ${SESAME_OIDC_ISSUER:-https://idp.sesame.localhost:8443/realms/sesame}
      SESAME_OIDC_CLIENT_ID: ${SESAME_OIDC_PORTAL_CLIENT_ID:-sesame-portal}
      SESAME_OIDC_CLIENT_SECRET: ${SESAME_OIDC_PORTAL_CLIENT_SECRET:-dev-portal-client-secret}
      # En dev, clé coffre lisible ; en production préférer sub (ou oid pour Entra ID).
      SESAME_OIDC_USER_KEY_CLAIM: ${SESAME_OIDC_USER_KEY_CLAIM:-preferred_username}
      SESAME_OIDC_GROUPS_CLAIM: ${SESAME_OIDC_GROUPS_CLAIM:-groups}
      # Déconnexion aussi chez l'IdP (désactivée par défaut, activée en dev pour la tester).
      SESAME_OIDC_LOGOUT: ${SESAME_OIDC_LOGOUT:-true}
      # Lien « Administration » sur « Mes applications », pour le groupe d'administrateurs.
      SESAME_ADMIN_URL: https://admin.sesame.localhost:8443
      SESAME_ADMIN_GROUP: ${SESAME_ADMIN_GROUP:-sesame-admins}
      # Demandes d'accès avec identifiants (ADR 0029) : relais vers le service interne du proxy.
      SESAME_PROXY_INTERNAL_URL: http://proxy:8082
      SESAME_INTERNAL_TOKEN: dev-internal-token
      SESAME_DATABASE_URL: postgres://sesame:dev-db-password@postgres:5432/sesame
      # Clé de dev (base64, 32 octets) : chiffre l'état OIDC temporaire.
      SESAME_PORTAL_STATE_KEY: c2VzYW1lLWRldi1wb3J0YWwtc3RhdGUta2V5LTAwMDE=
      SESAME_CA_FILE: /etc/sesame/ca.crt
      RUST_LOG: info
    volumes:
      - ./descriptors:/etc/sesame/descriptors:ro
      - ./deploy/nginx/certs/ca.crt:/etc/sesame/ca.crt:ro
    depends_on:
      postgres: { condition: service_healthy }
      # À décommenter avec le service keycloak (version autonome) :
      # keycloak: { condition: service_healthy }
    # La discovery OIDC passe par Nginx, qui peut démarrer après le portail ; sans IdP
    # joignable, le portail redémarre jusqu'à ce qu'il le soit.
    restart: on-failure

  proxy:
    build:
      context: .
      dockerfile: deploy/docker/rust.Dockerfile
      args: { BIN: sesame-proxy }
      target: runtime-proxy
    environment:
      SESAME_PROXY_LISTEN: 0.0.0.0:8081
      SESAME_DESCRIPTORS_DIR: /etc/sesame/descriptors
      SESAME_PORTAL_URL: https://sesame.localhost:8443
      SESAME_COOKIE_DOMAIN: sesame.localhost
      SESAME_DATABASE_URL: postgres://sesame:dev-db-password@postgres:5432/sesame
      # Clé de dev (base64, 32 octets) : chiffre les cookies applicatifs au repos.
      SESAME_SESSION_ENCRYPTION_KEY: c2VzYW1lLWRldi1hcHAtc2Vzc2lvbi1rZXktMDAwMDE=
      # Coffre de secrets : PostgreSQL par défaut (ADR 0021, pas de brique externe
      # supplémentaire). Clé de dev (base64, 32 octets), distincte de celle des sessions.
      SESAME_SECRETS_ENCRYPTION_KEY: c2VzYW1lLWRldi1zZWNyZXRzLWtleS0wMDAwMDAwMTI=
      SESAME_CA_FILE: /etc/sesame/ca.crt
      # Service interne des demandes d'accès (ADR 0029), jamais exposé par Nginx.
      SESAME_INTERNAL_TOKEN: dev-internal-token
      # Dev : réponse de l'appli conservée en cas d'échec de rejeu, visible dans l'admin (ADR 0018).
      SESAME_REPLAY_DEBUG: "true"
      RUST_LOG: info
    volumes:
      - ./descriptors:/etc/sesame/descriptors:ro
      - ./deploy/nginx/certs/ca.crt:/etc/sesame/ca.crt:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure

  admin:
    build: { context: ., dockerfile: admin/Dockerfile }
    environment:
      SESAME_ADMIN_LISTEN: 0.0.0.0:8000
      SESAME_ADMIN_PUBLIC_URL: https://admin.sesame.localhost:8443
      # Clé de dev : signe le cookie de session de l'administration.
      SESAME_ADMIN_SESSION_KEY: dev-admin-session-key-not-for-production
      SESAME_ADMIN_GROUP: ${SESAME_ADMIN_GROUP:-sesame-admins}
      SESAME_DESCRIPTORS_DIR: /etc/sesame/descriptors
      SESAME_SCHEMA_FILE: /etc/sesame/app-descriptor.schema.json
      SESAME_DATABASE_URL: postgres://sesame:dev-db-password@postgres:5432/sesame
      # Même IdP que le portail, client dédié à l'administration.
      SESAME_OIDC_ISSUER: ${SESAME_OIDC_ISSUER:-https://idp.sesame.localhost:8443/realms/sesame}
      SESAME_OIDC_CLIENT_ID: ${SESAME_OIDC_ADMIN_CLIENT_ID:-sesame-admin}
      SESAME_OIDC_CLIENT_SECRET: ${SESAME_OIDC_ADMIN_CLIENT_SECRET:-dev-admin-client-secret}
      SESAME_OIDC_USER_KEY_CLAIM: ${SESAME_OIDC_USER_KEY_CLAIM:-preferred_username}
      SESAME_OIDC_GROUPS_CLAIM: ${SESAME_OIDC_GROUPS_CLAIM:-groups}
      # Même clé que le proxy : l'admin chiffre, le proxy déchiffre (ADR 0021).
      SESAME_SECRETS_ENCRYPTION_KEY: c2VzYW1lLWRldi1zZWNyZXRzLWtleS0wMDAwMDAwMTI=
      SESAME_CA_FILE: /etc/sesame/ca.crt
      # Service recorder interne, pour le bouton « Analyser une page de login ».
      SESAME_RECORDER_URL: http://recorder:8090
      SESAME_RECORDER_TOKEN: dev-recorder-token
      # Notifications par mail (ADR 0030) : serveur et destinataires dans la console ; seul le mot
      # de passe SMTP est ici, facultatif (relais interne sans authentification).
      SESAME_SMTP_PASSWORD: ${SESAME_SMTP_PASSWORD:-}
    volumes:
      - ./descriptors:/etc/sesame/descriptors:ro
      - ./schemas/app-descriptor.schema.json:/etc/sesame/app-descriptor.schema.json:ro
      - ./deploy/nginx/certs/ca.crt:/etc/sesame/ca.crt:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sesame
      POSTGRES_USER: sesame
      POSTGRES_PASSWORD: dev-db-password
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesame -d sesame"]
      interval: 2s
      retries: 30

  # Registre des comptes de dev (en production : l'UI d'administration). Provisionne le
  # seul compte de l'appli factice : facultatif, profil « demo » (voir `fake-app`).
  db-seed:
    image: postgres:17-alpine
    profiles: [demo]
    environment:
      PGPASSWORD: dev-db-password
    volumes: [./dev/postgres/seed.sh:/seed.sh:ro]
    entrypoint: ["sh", "/seed.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Coffre de secrets de dev (ADR 0021) : le couple (fake-app, alice) est déclaré ici,
  # chiffré avec la même clé que le proxy et l'admin. Réutilise l'image de l'admin
  # (dépendances Python déjà présentes : cryptography, asyncpg). Facultatif, profil
  # « demo » (voir `fake-app`).
  secrets-seed:
    build: { context: ., dockerfile: admin/Dockerfile }
    profiles: [demo]
    entrypoint: ["python", "/seed/seed_secret.py"]
    environment:
      SESAME_DATABASE_URL: postgres://sesame:dev-db-password@postgres:5432/sesame
      SESAME_SECRETS_ENCRYPTION_KEY: c2VzYW1lLWRldi1zZWNyZXRzLWtleS0wMDAwMDAwMTI=
    volumes: [./dev/postgres/seed_secret.py:/seed/seed_secret.py:ro]
    depends_on:
      db-seed: { condition: service_completed_successfully }
    restart: "no"

  # Fournisseur d'identité de dev (version autonome, FACULTATIF) : Keycloak avec le realm
  # `sesame` (comptes alice / bob / carol / admin, voir docs/dev.md). Ne fait pas partie de
  # Sesame : à décommenter seulement sans IdP existant, avec la ligne `keycloak:` du
  # `depends_on` du portail. Exigé par make up-demo et make e2e.
  # keycloak:
  #   image: keycloak/keycloak:26.0
  #   command: start-dev --import-realm
  #   environment:
  #     KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
  #     KC_BOOTSTRAP_ADMIN_PASSWORD: kcadmin
  #     KC_HOSTNAME: https://idp.sesame.localhost:8443
  #     KC_PROXY_HEADERS: xforwarded
  #     KC_HTTP_ENABLED: "true"
  #     KC_HEALTH_ENABLED: "true"
  #   volumes:
  #     - ./dev/keycloak/sesame-realm.json:/opt/keycloak/data/import/sesame-realm.json:ro
  #   healthcheck:
  #     # Pas de curl dans l'image : requête HTTP brute sur le port de management.
  #     test:
  #       - CMD-SHELL
  #       - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"
  #     interval: 5s
  #     retries: 60

  # Test de santé des formulaires de login (à planifier : cron, CI…).
  # Lancement ponctuel : docker compose run --rm health
  health:
    build: ./onboarding
    profiles: [tools]
    volumes:
      - ./descriptors:/etc/sesame/descriptors:ro
      - ./schemas/app-descriptor.schema.json:/etc/sesame/app-descriptor.schema.json:ro
    depends_on: [fake-app]

  # Recorder : service HTTP interne d'analyse d'une page de login (sans identifiant).
  # Appelé par l'admin ; jamais exposé via Nginx. Aussi utilisable en one-shot :
  # make record URL=… (remplace l'entrypoint par la CLI).
  recorder:
    build: { context: ., dockerfile: onboarding/recorder.Dockerfile }
    environment:
      SESAME_RECORDER_LISTEN: 0.0.0.0:8090
      # Jeton de dev partagé avec l'admin (à remplacer hors dev).
      SESAME_RECORDER_TOKEN: dev-recorder-token
      SESAME_RECORDER_SCHEMA: /etc/sesame/app-descriptor.schema.json
      # Domaine des hôtes publics proposés (<id>.sesame.localhost:8443, servi par Nginx).
      SESAME_APPS_DOMAIN: sesame.localhost:8443
      # Accepte le certificat de dev des applis exposées via Nginx.
      SESAME_CA_FILE: /etc/sesame/ca.crt
    volumes:
      - ./schemas/app-descriptor.schema.json:/etc/sesame/app-descriptor.schema.json:ro
      - ./deploy/nginx/certs/ca.crt:/etc/sesame/ca.crt:ro
    restart: on-failure

  # Appli cible de démo (login / mot de passe, CSRF), utile pour essayer Sesame ou
  # lancer les tests e2e / de santé. Facultative, profil « demo » :
  # `docker compose --profile demo up` (ou `make up-demo`).
  fake-app:
    build: ./dev/fake-app
    profiles: [demo]
    environment:
      FAKE_APP_USERS: amartin:dev-amartin-app-password,cdupont:dev-cdupont-app-password
      FAKE_APP_SESSION_TTL: "300"
      FAKE_APP_INTERNAL_URL: http://fake-app:8000
    # Pas de port publié : l'appli n'est joignable que via le proxy.

volumes:
  postgres-data:

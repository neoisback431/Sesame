# Frontal TLS de dev. Une appli par nom d'hôte sous *.sesame.localhost.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  log_format json escape=json
    '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
    '"uri":"$uri","status":$status,"duration":$request_time,'
    '"upstream":"$upstream_addr","request_id":"$request_id"}';
  # $uri plutôt que $request_uri : pas de query string dans les logs.
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  ssl_certificate     /etc/nginx/certs/sesame.crt;
  ssl_certificate_key /etc/nginx/certs/sesame.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Request-Id $request_id;
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;

  add_header Strict-Transport-Security "max-age=31536000" always;

  # Portail d'authentification.
  server {
    listen 8443 ssl;
    server_name sesame.localhost;
    location / { proxy_pass http://portal:8080; }
  }

  # Fournisseur d'identité de dev (Keycloak).
  server {
    listen 8443 ssl;
    server_name idp.sesame.localhost;
    location / { proxy_pass http://keycloak:8080; }
  }

  # Toutes les applis protégées : moteur de proxy (routage par Host).
  server {
    listen 8443 ssl default_server;
    server_name *.sesame.localhost;
    location / { proxy_pass http://proxy:8081; }
  }
}

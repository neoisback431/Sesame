# SPDX-License-Identifier: Apache-2.0
# CI minimale : la logique vit dans le Makefile pour rester portable
# (le dépôt public est sur GitHub).

stages: [lint, test, build]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

.rust:
  image: rust:1-slim-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y -qq make >/dev/null
    - rustup component add rustfmt clippy
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [.cargo/registry, target]

.python:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq make >/dev/null

lint:rust:
  extends: .rust
  stage: lint
  script: [make lint-rust]

lint:licenses:
  extends: .rust
  stage: lint
  script:
    - cargo install --locked cargo-deny
    - cargo deny check licenses

lint:licenses-python:
  extends: .python
  stage: lint
  script: [make deny-python]

lint:python:
  extends: .python
  stage: lint
  script: [make lint-python validate-descriptors check-dev-keys]

test:rust:
  extends: .rust
  stage: test
  script: [make test-rust]

test:postgres:
  extends: .rust
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_PASSWORD: test
    SESAME_TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/postgres
  script: [cargo test -p sesame-store-postgres --locked]

# Même suite de contrat côté Python (schéma créé depuis les migrations si absent).
test:postgres-python:
  extends: .python
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_PASSWORD: test
    SESAME_TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/postgres
  script: [cd admin && uv run --group dev pytest -q tests/test_store_contract.py]

# Suite complète, navigateur compris : image Playwright de même version que uv.lock
# et recorder.Dockerfile.
test:python:
  image: mcr.microsoft.com/playwright/python:v1.63.0-noble
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq make >/dev/null
    - pip install -q --break-system-packages uv
  script: [make test-python-full]

build:images:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker compose build

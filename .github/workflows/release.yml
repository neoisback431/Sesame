# SPDX-License-Identifier: Apache-2.0
# Release : construit et publie les 4 images Docker sur GitHub Container Registry, puis crée
# la Release GitHub correspondante. Se déclenche sur un tag `vX.Y.Z` poussé manuellement
# (git tag vX.Y.Z && git push origin vX.Y.Z). Logique dans le Makefile (make release-images) :
# ce fichier reste mince, comme la CI GitLab (.gitlab-ci.yml).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ghcr.io exige des noms en minuscules ; le propriétaire du dépôt ne l'est pas
      # toujours (organisations).
      - name: Registre en minuscules
        id: registry
        run: echo "value=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/sesame" >> "$GITHUB_OUTPUT"

      - name: Construit et publie les images
        run: make release-images VERSION=${{ github.ref_name }} REGISTRY=${{ steps.registry.outputs.value }}

      - name: Archives des kits de déploiement
        run: make release-kit VERSION=${{ github.ref_name }} REGISTRY=${{ steps.registry.outputs.value }}

      # Notes rédigées dans docs/releases/<tag>.md si elles existent, sinon générées depuis
      # les commits. Les archives des kits de déploiement (Compose, AWS) sont jointes à la Release.
      - name: Crée la Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          kits="dist/sesame-deploy-${TAG}.tar.gz dist/sesame-aws-${TAG}.tar.gz"
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" $kits --title "Sesame ${TAG#v}" --notes-file "$notes"
          else
            gh release create "$TAG" $kits --title "Sesame ${TAG#v}" --generate-notes
          fi

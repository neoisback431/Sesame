[project]
name = "sesame-fake-app"
version = "0.1.0"
description = "Appli factice de dev pour Sesame : formulaire de login + CSRF."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "gunicorn>=22"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fake_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
